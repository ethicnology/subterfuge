name: subterfuge
version: 2.0.0
summary: Shamir Secret Sharing SLIP39
description: A Shamir secret sharing experience using SLIP39 implementation.

confinement: strict
base: core24
grade: stable

slots:
  dbus-subterfuge:
    interface: dbus
    bus: session
    name: com.ethicnology.subterfuge

apps:
  subterfuge:
    command: subterfuge
    extensions: [flutter-master]
    # No `network` plug: this app never performs network I/O (verified: no
    # network/HTTP dependency in pubspec.yaml, no INTERNET permission in the
    # Android release manifest, no network-client entitlement in the macOS
    # release sandbox). url_launcher delegates to the user's default browser
    # via the desktop portal, which does not require this app's own network
    # access.
    slots:
      - dbus-subterfuge
parts:
  subterfuge:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
