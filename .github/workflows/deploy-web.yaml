name: deploy-web
on:
  push:
    branches:
      - main

# This app processes cryptographic secrets (mnemonics/seeds/shares).
# Deploying to GitHub Pages exclusively through this CI workflow (instead of
# a developer's local `gh-pages.sh` force-push) guarantees that whatever is
# served at https://ethicnology.github.io/subterfuge/ was built from the
# exact, reviewable commit on `main` — no local machine in the loop.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two concurrent deployments racing each other; let in-flight runs
# finish so what gets served is never a half-deployed mix of two commits.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FVM_VERSION: "4.1.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash -s -- "$FVM_VERSION"
          echo "$HOME/fvm/bin" >> $GITHUB_PATH

      - run: fvm install
      - run: fvm flutter pub get
      - run: fvm flutter analyze
      - run: fvm flutter test
      - run: fvm flutter build web --release --base-href '/subterfuge/'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
